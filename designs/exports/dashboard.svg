<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <!-- Background -->
  <rect width="1440" height="900" fill="#f9fafb"/>
  
  <!-- Navigation Bar -->
  <rect width="1440" height="64" fill="#ffffff"/>
  <rect y="64" width="1440" height="1" fill="#e5e7eb"/>
  
  <!-- Logo Icon -->
  <rect x="16" y="12" width="40" height="40" rx="10" fill="#2563eb"/>
  <circle cx="36" cy="32" r="10" stroke="white" stroke-width="2" fill="none"/>
  <path d="M36 26 L36 32 L40 32" stroke="white" stroke-width="2" fill="none"/>
  
  <!-- Logo Text -->
  <text x="68" y="42" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#111827">Timesheet</text>
  
  <!-- Nav Buttons -->
  <rect x="190" y="14" width="110" height="36" rx="8" fill="#eff6ff"/>
  <text x="225" y="38" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#2563eb">Dashboard</text>
  
  <rect x="310" y="14" width="100" height="36" rx="8" fill="transparent"/>
  <text x="345" y="38" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Settings</text>
  
  <rect x="420" y="14" width="90" height="36" rx="8" fill="transparent"/>
  <text x="450" y="38" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Export</text>
  
  <!-- User Avatar -->
  <circle cx="1400" cy="32" r="20" fill="#3b82f6"/>
  <text x="1394" y="38" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="white">A</text>
  
  <!-- Summary Cards -->
  <!-- Card 1 - Total Hours -->
  <rect x="32" y="96" width="330" height="140" rx="16" fill="#ffffff" stroke="#f3f4f6"/>
  <text x="52" y="130" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Total Hours</text>
  <text x="52" y="175" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#111827">64</text>
  <text x="95" y="170" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#9ca3af">hrs</text>
  <rect x="270" y="110" width="56" height="56" rx="12" fill="#eff6ff"/>
  <circle cx="298" cy="138" r="14" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <path d="M298 130 L298 138 L304 138" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <text x="52" y="210" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#22c55e">↑ 12%</text>
  <text x="95" y="210" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#9ca3af">vs last month</text>
  
  <!-- Card 2 - Total Days -->
  <rect x="382" y="96" width="330" height="140" rx="16" fill="#ffffff" stroke="#f3f4f6"/>
  <text x="402" y="130" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Total Days</text>
  <text x="402" y="175" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#111827">8</text>
  <text x="430" y="170" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#9ca3af">days</text>
  <rect x="620" y="110" width="56" height="56" rx="12" fill="#f0fdf4"/>
  <rect x="635" y="122" width="26" height="32" rx="4" stroke="#22c55e" stroke-width="2" fill="none"/>
  <path d="M640 135 L645 140 L655 128" stroke="#22c55e" stroke-width="2" fill="none"/>
  <text x="402" y="210" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#9ca3af">Based on 8 hrs/day</text>
  
  <!-- Card 3 - Entries -->
  <rect x="732" y="96" width="330" height="140" rx="16" fill="#ffffff" stroke="#f3f4f6"/>
  <text x="752" y="130" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Entries</text>
  <text x="752" y="175" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#111827">12</text>
  <text x="785" y="170" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#9ca3af">items</text>
  <rect x="970" y="110" width="56" height="56" rx="12" fill="#faf5ff"/>
  <line x1="982" y1="130" x2="1014" y2="130" stroke="#a855f7" stroke-width="2"/>
  <line x1="982" y1="138" x2="1014" y2="138" stroke="#a855f7" stroke-width="2"/>
  <line x1="982" y1="146" x2="1000" y2="146" stroke="#a855f7" stroke-width="2"/>
