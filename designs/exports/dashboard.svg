  <text x="616" y="380" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6b7280">Internal Project</text>
  <rect x="816" y="365" width="90" height="24" rx="12" fill="#dbeafe"/>
  <text x="840" y="382" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#1d4ed8">Development</text>
  <text x="1100" y="380" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">8:00</text>
