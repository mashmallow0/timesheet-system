  <text x="616" y="424" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6b7280">Client Project A</text>
  <rect x="816" y="409" width="70" height="24" rx="12" fill="#ffedd5"/>
  <text x="830" y="426" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#c2410c">Bug Fixing</text>
  <text x="1100" y="424" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">4:30</text>
  <text x="1180" y="424" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#111827" text-anchor="middle">0.56</text>
  
  <!-- Row 3 -->
  <line x1="496" y1="492" x2="1408" y2="492" stroke="#f3f4f6"/>
  <text x="516" y="468" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#111827">19 Mar</text>
  <text x="616" y="468" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6b7280">0000000-Others / Support</text>
  <rect x="816" y="453" width="85" height="24" rx="12" fill="#f3e8ff"/>
