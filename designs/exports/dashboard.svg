  <text x="52" y="590" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#374151">Hours</text>
  <rect x="52" y="600" width="190" height="44" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="137" y="627" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#111827">0</text>
  
  <text x="262" y="590" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#374151">Minutes</text>
  <rect x="262" y="600" width="190" height="44" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="347" y="627" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#111827">0</text>
  
  <text x="52" y="670" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#374151">Note</text>
