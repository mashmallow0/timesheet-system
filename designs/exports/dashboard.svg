  <text x="1260" y="380" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#3b82f6">✎</text>
  <text x="1300" y="380" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#ef4444">🗑</text>
  
  <!-- Row 2 -->
