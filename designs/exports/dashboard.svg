  <rect x="52" y="360" width="400" height="44" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="68" y="387" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6b7280">2026-03-20</text>
  
  <text x="52" y="430" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#374151">Feature</text>
  <rect x="52" y="440" width="400" height="44" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="68" y="467" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#374151">Select Feature</text>
  <path d="M428 460 L436 468 L444 460" stroke="#9ca3af" stroke-width="2" fill="none"/>
  
  <text x="52" y="510" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#374151">Activity</text>
  <rect x="52" y="520" width="400" height="44" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
