  <text x="1100" y="468" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">1:00</text>
  <text x="1180" y="468" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#111827" text-anchor="middle">0.13</text>
  
  <!-- Row 4 -->
  <line x1="496" y1="536" x2="1408" y2="536" stroke="#f3f4f6"/>
  <text x="516" y="512" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#111827">18 Mar</text>
  <text x="616" y="512" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6b7280">Client Project B</text>
  <rect x="816" y="497" width="90" height="24" rx="12" fill="#dcfce7"/>
  <text x="830" y="514" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#15803d">Support Case</text>
  <text x="1100" y="512" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">2:00</text>
  <text x="1180" y="512" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#111827" text-anchor="middle">0.25</text>
  
  <!-- Row 5 -->
  <line x1="496" y1="580" x2="1408" y2="580" stroke="#f3f4f6"/>
  <text x="516" y="556" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#111827">18 Mar</text>
  <text x="616" y="556" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6b7280">Internal Project</text>
  <rect x="816" y="541" width="90" height="24" rx="12" fill="#dbeafe"/>
  <text x="840" y="558" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#1d4ed8">Development</text>
  <text x="1100" y="556" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">5:00</text>
  <text x="1180" y="556" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#111827" text-anchor="middle">0.63</text>
  
  <!-- Pagination -->
