  <rect x="1150" y="595" width="70" height="32" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="1185" y="615" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Previous</text>
  <rect x="1230" y="595" width="32" height="32" rx="6" fill="#2563eb"/>
  <text x="1246" y="615" font-family="Inter, system-ui, sans-serif" font-size="12" fill="white" text-anchor="middle">1</text>
  <rect x="1270" y="595" width="32" height="32" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="1286" y="615" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">2</text>
  <rect x="1310" y="595" width="32" height="32" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="1326" y="615" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">3</text>
  <rect x="1350" y="595" width="50" height="32" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="1375" y="615" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Next</text>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
  </defs>
