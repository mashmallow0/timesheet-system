  <text x="1100" y="960" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#3b82f6">✎</text>
  <text x="1140" y="960" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#ef4444">🗑</text>
  
  <rect x="276" y="980" width="888" height="40" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="292" y="1006" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#374151">Non-development related meeting</text>
  <text x="1100" y="1006" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#3b82f6">✎</text>
  <text x="1140" y="1006" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#ef4444">🗑</text>
  
  <!-- Add Activity Input -->
