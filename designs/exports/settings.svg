  <text x="1100" y="868" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#3b82f6">✎</text>
  <text x="1140" y="868" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#ef4444">🗑</text>
  
  <rect x="276" y="888" width="888" height="40" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
