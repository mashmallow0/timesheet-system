  <text x="1100" y="630" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#3b82f6">✎</text>
  <text x="1140" y="630" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#ef4444">🗑</text>
  
